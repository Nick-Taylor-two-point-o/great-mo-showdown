name: Update Mo totals

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the hour, when GitHub is less busy)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-totals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read totals from Movember
        run: python scripts/update_totals.py

      - name: Commit if the totals changed
        run: |
          if git diff --quiet -- data/totals.json; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/totals.json
            git commit -m "Update Mo totals"
            git push
          fi

      - name: Keep page copies if a total couldn't be read
        if: always() && hashFiles('debug/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: movember-page-debug
          path: debug/
          retention-days: 7
